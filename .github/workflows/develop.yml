name: develop-bake
on:
  push:
    branches:
      - main
    paths:
      - 'dockerfile/**'
      - 'docker-bake.hcl'
      - 'stash/**'
  workflow_dispatch:
  schedule:
    # weekly rebuild for base image and package updates
    - cron: '0 0 */7 * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: meta
        name: set meta environment variables
        run: |
          echo "EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(git log -1 --pretty=%cI)" >> $GITHUB_OUTPUT
          echo "GITHASH=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
          digest=$(curl -sf https://hub.docker.com/v2/repositories/stashapp/stash/tags/development | jq -er .digest)
          echo "STASH_DEVELOP_REF=development@${digest}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          targets: |
            develop_ci_alpine
            develop_ci_debian
        env:
          CI: true
          GITHASH: ${{ steps.meta.outputs.GITHASH }}
          BUILD_DATE: ${{ steps.meta.outputs.TIMESTAMP }}
          SOURCE_DATE_EPOCH: ${{ env.EPOCH }}
          STASH_DEVELOP_REF: ${{ steps.meta.outputs.STASH_DEVELOP_REF }}
